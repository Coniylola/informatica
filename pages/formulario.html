<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body> 
    <form id="formulario">
        <h1>Formulario de ingreso</h1>
        <div>
            <label for="nombre">Escribe tu nombre:</label>
            <input type="text" id="nombre" name="nombre">
        </div>
        <div>
            <label for="edad">¿Cuantos años tienes?</label>
            <input type="number" id="edad" name="edad">
        </div>
        <div>
            <label>Pasatiempos:</label><br>
            <input type="radio" id="deporte" name="pasatiempo" valve="deporte">
            <label for="deporte">Deportes</label>
        </div>
        <div>
            <input type="radio" id="musica" name="pasatiempo" valve="musica">
            <label for="musica">música</label>
        </div>
        <div>
            <input type="radio" id="dibujo" name="pasatiempo" valve="dibujo">
            <label for="dibujo">dibujo</label>
        </div>
        <button type="button" onclick="saludar()">Enviar</button>
        <table></table>

    </form>
</body>
</html>
